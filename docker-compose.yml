services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace
    volumes:
      - trace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Compose 启动时安装依赖（镜像构建期完成）并自动建库建表
      DATABASE_URL: postgresql+psycopg2://trace:trace@db:5432/trace
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  trace_pgdata:
